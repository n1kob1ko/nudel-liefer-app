# Daily check of the off-site database backup (NUD-094, NUD-197).
#
# The backup itself does NOT run here. The production database listens on 127.0.0.1 of the
# dedicated server, so a GitHub runner cannot reach it: `pnpm backup:db` runs on the server every
# night (systemd timer, deploy/backup/) and copies the dump to the private backup bucket.
#
# This workflow is the watchdog and the test restore: it downloads the newest backup from the
# bucket, fails when it is older than BACKUP_MAX_AGE_HOURS (the job on the server has stopped or
# cannot reach the bucket), restores it into a scratch PostgreSQL and checks the data. A failed run
# e-mails the repository admins (GitHub default).
#
# Secrets live in the GitHub *environment* "backup" (Settings > Environments), not in the
# repository secrets: BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET, BACKUP_S3_ACCESS_KEY_ID,
# BACKUP_S3_SECRET_ACCESS_KEY (the same bucket values as in /etc/nudel-backup.env on the server; a
# read-only token is enough here). Setup, restore and drill: docs/runbook.md section 5.
name: Database backup check

on:
  schedule:
    # 04:23 UTC every day, two hours after the backup on the server (02:23 UTC).
    - cron: "23 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

env:
  # Must be >= the major version of the production PostgreSQL (the dedicated server runs 18):
  # pg_restore cannot read a dump made by a newer pg_dump.
  PG_MAJOR: "18"
  # Two nights: one missed run is tolerated, a second one fails the check.
  BACKUP_MAX_AGE_HOURS: "50"

jobs:
  verify:
    # Pinned, not `ubuntu-latest`: the client is installed from the PostgreSQL apt repository of
    # this Ubuntu release, and a moving label breaks that the day it moves.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: backup
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: restore_check }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      # Placeholder so that the shared config parser is satisfied; this job never connects to it.
      BACKUP_DATABASE_URL: postgresql://unused:unused@localhost/unused
      RESTORE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restore_check
    steps:
      - name: The bucket secrets must be set
        run: |
          missing=""
          [ -n "$BACKUP_S3_BUCKET" ] || missing="$missing BACKUP_S3_BUCKET"
          [ -n "$BACKUP_S3_ACCESS_KEY_ID" ] || missing="$missing BACKUP_S3_ACCESS_KEY_ID"
          [ -n "$BACKUP_S3_SECRET_ACCESS_KEY" ] || missing="$missing BACKUP_S3_SECRET_ACCESS_KEY"
          if [ -n "$missing" ]; then
            echo "::error::No off-site backup can be checked: these secrets are missing in the GitHub environment \"backup\":$missing. See docs/runbook.md section 5.5."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install PostgreSQL client ${{ env.PG_MAJOR }}
        # From the PostgreSQL project's own apt repository: Ubuntu ships an older major version.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg-nudel.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Newest backup is fresh and restores
        run: pnpm backup:verify --max-age-hours "$BACKUP_MAX_AGE_HOURS"
